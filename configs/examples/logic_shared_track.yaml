# Worked example: Alchemy / 8-Bit Memories on Logic Track 1.
# Copy to configs/my_shared_track.yaml and replace YOUR_... device names.
# Verify this preset-specific page/slot layout before sending actions.
adapter:
  type: logic_hybrid
  midi:
    sample_rate: 44100
    routes:
      - track_id: shared
        name: Shared Human-Agent Track
        input_port: "YOUR_KEYBOARD_INPUT"
        input_source: human
  mackie:
    # Two pairs give numbered port names; only Controller 1 is used here.
    controller_count: 2
    inter_message_delay: 0.01
    relative_deadzone: 0.1
    max_steps_per_action: 8
    restore_logic_track: 1
    controllers:
      - controller: 1
        id: shared
        track: 1
        parameters:
          - {id: shared/page_1/slot_1, name: Robotc}
          - {id: shared/page_1/slot_2, name: Cutoff}
          - {id: shared/page_1/slot_3, name: Arp Md}
          - {id: shared/page_1/slot_4, name: Thin}
          - {id: shared/page_1/slot_5, name: Porto}
          - {id: shared/page_1/slot_6, name: Res}
          - {id: shared/page_1/slot_7, name: ArpRat}
          - {id: shared/page_1/slot_8, name: ArpOct}

environment:
  event_capacity: 128
  max_tracks: 2
  max_parameters: 16

tracks:
  - alias: shared
    observe: [notes, velocity, controls, plugin_parameters]
    # The scripted policy sends actions only for this role.
    actions:
      add:
        - id: parameter_vector
          target: plugin.relative_vector
          representation: continuous
          shape: [8]
          range: [-1.0, 1.0]
          encoding:
            parameters:
              - {id: shared/page_1/slot_1, page: 1, slot: 1}
              - {id: shared/page_1/slot_2, page: 1, slot: 2}
              - {id: shared/page_1/slot_3, page: 1, slot: 3}
              - {id: shared/page_1/slot_4, page: 1, slot: 4}
              - {id: shared/page_1/slot_5, page: 1, slot: 5}
              - {id: shared/page_1/slot_6, page: 1, slot: 6}
              - {id: shared/page_1/slot_7, page: 1, slot: 7}
              - {id: shared/page_1/slot_8, page: 1, slot: 8}
