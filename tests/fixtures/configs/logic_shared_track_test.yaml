# Test 1: human plays Track 1 while the agent changes that same track's instrument.
adapter:
  type: logic_hybrid
  midi:
    sample_rate: 44100
    routes:
      - track_id: shared
        name: Shared Human-Agent Track
        input_port: "Test Keyboard"
        input_source: human
  mackie:
    # Create the existing numbered port pairs; this test uses Controller 1 only.
    controller_count: 2
    inter_message_delay: 0.01
    relative_deadzone: 0.1
    max_steps_per_action: 8
    restore_logic_track: 1
    controllers:
      - controller: 1
        id: shared
        track: 1
        parameters:
          - {id: shared/page_1/slot_1, name: Knob 1}
          - {id: shared/page_1/slot_2, name: Knob 2}
          - {id: shared/page_1/slot_3, name: Knob 3}
          - {id: shared/page_1/slot_4, name: Knob 4}
          - {id: shared/page_1/slot_5, name: Knob 5}
          - {id: shared/page_1/slot_6, name: Knob 6}
          - {id: shared/page_1/slot_7, name: Knob 7}
          - {id: shared/page_1/slot_8, name: Knob 8}

environment:
  event_capacity: 128
  max_tracks: 2
  max_parameters: 16

tracks:
  - alias: shared
    observe: [notes, velocity, controls, plugin_parameters]
    actions:
      add:
        - id: parameter_vector
          target: plugin.relative_vector
          representation: continuous
          shape: [8]
          range: [-1.0, 1.0]
          encoding:
            parameters:
              - {id: shared/page_1/slot_1, page: 1, slot: 1}
              - {id: shared/page_1/slot_2, page: 1, slot: 2}
              - {id: shared/page_1/slot_3, page: 1, slot: 3}
              - {id: shared/page_1/slot_4, page: 1, slot: 4}
              - {id: shared/page_1/slot_5, page: 1, slot: 5}
              - {id: shared/page_1/slot_6, page: 1, slot: 6}
              - {id: shared/page_1/slot_7, page: 1, slot: 7}
              - {id: shared/page_1/slot_8, page: 1, slot: 8}
