# Quick hardware test: Python reads the keyboard directly while the agent sends
# MIDI to Logic through IAC Bus 1. This verifies the bridge but does not yet
# observe MIDI after Logic has processed/routed it.
adapter:
  type: logic_midi
  sample_rate: 44100
  routes:
    - alias: human
      name: Human Keyboard
      input_port: "Test Keyboard"
      input_source: human
    - alias: agent_bass
      name: Agent Bass Track
      output_port: "Test Agent Bus"
      channel: 0
    - alias: agent_lead
      name: Agent Lead Track
      output_port: "Test Second Bus"
      channel: 0

environment:
  event_capacity: 128
  max_tracks: 3
  max_parameters: 1

tracks:
  - alias: human
    observe: [notes, velocity, controls]
  - alias: agent_bass
    actions:
      preset: expressive_instrument
  - alias: agent_lead
    actions:
      preset: expressive_instrument
