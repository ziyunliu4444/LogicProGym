[build-system]
# setuptools builds the installable package found under src/.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "LogicProGym"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "A Gymnasium interface for real-time, multi-track control in Logic Pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0,<2",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "sounddevice>=0.5,<1",
    "torch>=2.2.0",
    "tensorboard>=2.15.0",
    "tqdm>=4.66.0",
]

[project.scripts]
logicprogym = "logicprogym.cli:main"

[project.optional-dependencies]
# All product features are included above. Only developer test tools are extra.
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logicprogym = ["native/*.swift", "native/*.plist"]

[tool.setuptools.data-files]
# Preserve the checkout's relative documentation links in installed packages.
"share/logicprogym" = ["README.md", "CONTRIBUTING.md"]
"share/logicprogym/protocol" = ["protocol/spec-v1.md"]
"share/logicprogym/configs/examples" = ["configs/examples/*.yaml"]
# Retain the flat template location for existing installed entry points.
"share/logicprogym/configs" = ["configs/examples/*.yaml"]
"share/logicprogym/docs" = ["docs/*.md", "CHANGELOG.md"]
"share/logicprogym/examples" = ["examples/*.py", "examples/README.md"]
"share/logicprogym/tools" = ["tools/logic_midi_learn.py", "tools/logic_midi_cc_test.py", "tools/README.md"]
"share/logicprogym/live_tests" = ["live_tests/*.py", "live_tests/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
